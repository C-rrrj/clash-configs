# Cloady 节点 + 住宅 IP · Clash / FlClash 配置
# 导入方法：FlClash / Clash Meta 里选「导入配置文件」，选这个文件即可
# 节点：Cloady-USW1（美国西海岸，VLESS + WS + TLS）
# 节点：住宅IP-美国（静态住宅 IP，SOCKS5，@维易 推文赠送，到期 2026-12-13；账号密码是公开的，别用它登重要账号）

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: Cloady-USW1
    type: vless
    server: cloady-xray-zip-x9a411m9-workspace-tcsn21.cloady.io
    port: 443
    uuid: 990eaba0-ff03-4792-97a6-1e44febac59a
    tls: true
    servername: cloady-xray-zip-x9a411m9-workspace-tcsn21.cloady.io
    network: ws
    ws-opts:
      path: /a36b565c0456
      headers:
        Host: cloady-xray-zip-x9a411m9-workspace-tcsn21.cloady.io
    udp: true

  - name: 住宅IP-美国
    type: socks5
    server: 89.47.127.47
    port: 5432
    username: xsaie
    password: mohkde2n
    udp: true

proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - Cloady-USW1
      - 住宅IP-美国

rules:
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - MATCH,节点选择
